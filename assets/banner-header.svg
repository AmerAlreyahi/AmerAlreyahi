<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Amer Zuher Alriyahi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#14100a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a1c"/>
      <stop offset="0.25" stop-color="#f6e3a1"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="0.75" stop-color="#f6e3a1"/>
      <stop offset="1" stop-color="#8a6a1c"/>
    </linearGradient>
    <linearGradient id="goldText" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#b08d2a"/>
      <stop offset="0.35" stop-color="#f6e3a1"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="0.65" stop-color="#f6e3a1"/>
      <stop offset="1" stop-color="#b08d2a"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-300 0;300 0;-300 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#d4af37" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0.05"/>
    </linearGradient>
      <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e3a1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f6e3a1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f6e3a1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g stroke="#d4af37" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M150 0V300M300 0V300M450 0V300M600 0V300M750 0V300M900 0V300M1050 0V300"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-90 0;90 0;-90 0" dur="14s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <path d="M-250 236 C-50 194 130 274 350 236 S750 194 950 240 S1250 274 1450 236 V300 H-250Z" fill="url(#wave)"/>
    <path d="M-250 236 C-50 194 130 274 350 236 S750 194 950 240 S1250 274 1450 236" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.8"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="80 0;-80 0;80 0" dur="11s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <path d="M-250 258 C-10 222 170 290 390 254 S770 228 970 260 S1250 286 1450 258 V300 H-250Z" fill="#d4af37" fill-opacity="0.10"/>
  </g>
  <g fill="#f6e3a1">
    <circle cx="140" cy="260" r="1.6"><animate attributeName="cy" values="270;40" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="280" r="1.2"><animate attributeName="cy" values="285;60" dur="12s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="270" r="1.8"><animate attributeName="cy" values="275;30" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="282" r="1.3"><animate attributeName="cy" values="288;50" dur="13s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="13s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="268" r="1.7"><animate attributeName="cy" values="272;35" dur="11s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="1070" cy="278" r="1.4"><animate attributeName="cy" values="284;55" dur="12s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="12s" begin="5s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="-400" y="0" width="260" height="300" fill="url(#sweep)" transform="skewX(-20)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;1900 0;1900 0" keyTimes="0;0.45;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="1200" height="3" fill="url(#gold)"/>
  <rect x="0" y="297" width="1200" height="3" fill="url(#gold)"/>
  <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="7" fill="url(#goldText)">AMER ZUHER ALRIYAHI<animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/></text>
  <g transform="translate(600 188)">
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
    <rect x="-170" y="-0.75" width="156" height="1.5" fill="url(#gold)"/><rect x="14" y="-0.75" width="156" height="1.5" fill="url(#gold)"/>
    <rect x="-5" y="-5" width="10" height="10" transform="rotate(45)" fill="#d4af37"><animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/></rect>
